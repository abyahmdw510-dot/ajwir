const TBN={gd:'فارق الأهداف',gf:'الأهداف المسجلة',h2h:'المواجهة المباشرة',wins:'عدد الانتصارات',ga:'الأهداف المستقبلة (الأقل أفضل)'};
const gTeams=g=>S.teams.filter(t=>t.g==g),gExp=g=>{const n=gTeams(g).length;return n*(n-1)/2};
