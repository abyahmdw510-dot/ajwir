<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطولة آجوير المحلية لكرة القدم – النسخة 13</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f3f7f4;--cd:#fff;--tx:#10231a;--mu:#5d7266;--pr:#0b7a43;--ac:#f2b705;--ln:#dce6df;--rd:#d93636}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130d;--cd:#102019;--tx:#eaf4ee;--mu:#8fa89a;--pr:#27c26c;--ln:#1e3328}}
:root[data-theme="dark"]{--bg:#08130d;--cd:#102019;--tx:#eaf4ee;--mu:#8fa89a;--pr:#27c26c;--ln:#1e3328}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}main{max-width:760px;margin:auto;padding:12px}
.hero{background:linear-gradient(135deg,#064d2a,#0b7a43);color:#fff;border-radius:20px;padding:22px 16px;text-align:center}
.hero h1{margin:6px 0;font-size:24px}.hero .ed{display:inline-block;background:var(--ac);color:#10231a;font-weight:800;border-radius:99px;padding:2px 14px}
.card,.mc{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px;margin:10px 0;display:block;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{font-size:18px;margin:18px 0 6px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}.tm{flex:1;text-align:center;font-size:14px}.tm b{display:block;margin-top:4px}
.sc{font-size:26px;font-weight:800;min-width:76px;text-align:center}.big .sc{font-size:40px}
.lg{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--ln);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.rd{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px}.mt{text-align:center;font-size:12px;color:var(--mu);margin-top:8px}
.st{padding:1px 8px;border-radius:99px;background:var(--ln)}.st.live{background:var(--rd);color:#fff}.st.done{background:var(--pr);color:#fff}
.cd{display:flex;gap:8px;justify-content:center;margin-top:10px;direction:ltr}.cd div{background:var(--bg);border-radius:10px;padding:6px 10px;text-align:center;font-weight:800;font-size:20px}.cd small{display:block;font-size:10px;color:var(--mu);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid a,.tile{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center;font-weight:700}
.tile b{display:block;font-size:24px;color:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}th,td{padding:8px 3px;border-bottom:1px solid var(--ln)}td.n,th.n{text-align:right}.sx{overflow-x:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--mu)}nav a span{display:block;font-size:20px}nav a.on{color:var(--pr);font-weight:800}
footer{text-align:center;color:var(--mu);font-size:12px;margin:24px 0 8px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;max-width:100%}
button{background:var(--pr);color:#fff;border:0;font-weight:700;cursor:pointer}button.d{background:var(--rd)}
.f{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.f>*{flex:1 1 110px}.ev{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln);font-size:14px}
.demo{background:var(--ac);color:#10231a;text-align:center;border-radius:10px;padding:6px;font-weight:700;font-size:13px}
.bk{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px}.bk>div{flex:1}.bk .card{margin:4px 0;padding:8px}
.nw img{width:100%;max-height:200px;object-fit:cover;border-radius:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.pitch{position:relative;aspect-ratio:3/4;border-radius:14px;background:repeating-linear-gradient(#1c8a4a 0 12.5%,#188043 12.5% 25%);border:2px solid #ffffff80;overflow:hidden}
.pitch:before{content:"";position:absolute;inset:50% 0 auto;border-top:2px solid #ffffff80}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid #ffffff80;border-radius:50%;transform:translate(-50%,-50%)}
.pp{position:absolute;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:11px;width:64px;z-index:1}
.pp i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:auto;border-radius:50%;background:#fff;color:#064d2a;font-style:normal;font-weight:800;position:relative}
.pp u{position:absolute;top:-5px;right:-5px;background:var(--ac);border-radius:50%;font-size:9px;width:14px;height:14px;text-decoration:none;color:#10231a}
.pp span{display:block;text-shadow:0 1px 2px #000}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0}.tabs button{background:var(--cd);color:var(--tx);border:1px solid var(--ln);white-space:nowrap}.tabs button.on{background:var(--pr);color:#fff}
.tl{display:grid;grid-template-columns:1fr 44px 1fr;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px}.tl>b{text-align:center}
.ph{text-align:center;background:var(--bg);border-radius:99px;padding:4px;margin:6px 0;font-size:13px}.ba{display:inline-block;font-size:10px;background:var(--ln);border-radius:6px;padding:0 6px}
td .lg{width:30px;height:30px;font-size:13px}

.shb{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#07351b;font-weight:800;border-radius:12px;padding:10px 14px;font-size:14px}.wa svg{width:20px;height:20px}.sh2{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>{const m=(id,r,a,b)=>({id,round:r,a,b,date:'',time:'',venue:'',status:'wait',sa:null,sb:null,pa:null,pb:null,ev:[],la:'',lb:''});
return{demo:0,info:{name:'بطولة آجوير المحلية لكرة القدم',edition:'النسخة 13',village:'آجوير',venue:'',logo:'',text:''},
teams:['الإتحاد','التاكه','الفلوجة','السلام'].map((n,i)=>({id:i+1,name:n,logo:'',pl:[]})),
matches:[m('sf1','sf1',1,2),m('sf2','sf2',3,4),m('final','final',null,null)],news:[]}};
let S=blank();
let PW=(()=>{try{return sessionStorage.getItem('apw')||''}catch{return ''}})(),dirty=false;const U={isOwner:()=>!!PW};
const ST={wait:'لم تبدأ',live:'جارية الآن',done:'انتهت',post:'مؤجلة'},RD={sf1:'نصف النهائي الأول',sf2:'نصف النهائي الثاني',final:'النهائي'},IC={g:'⚽',pg:'⚽',pm:'❌',og:'🥅',y:'🟨',r:'🟥',s:'🔁',ko:'▶️',ht:'⏸️',sh:'▶️',ft:'🏁',et:'⏱️'},EN={g:'هدف',pg:'هدف من ركلة جزاء',pm:'ركلة جزاء مهدرة',og:'هدف عكسي (يُحتسب للخصم)',y:'بطاقة صفراء',r:'بطاقة حمراء',s:'تبديل',ko:'بداية الشوط الأول',ht:'نهاية الشوط الأول',sh:'بداية الشوط الثاني',ft:'نهاية المباراة',et:'وقت بدل الضائع'},PH=['ko','ht','sh','ft','et'],GL=['g','pg'];
let uid=Date.now(),tab='o';
const mig=()=>S.teams.forEach(t=>t.pl.forEach(p=>{p.id=p.id||++uid}));mig();
const P=id=>{for(const t of S.teams){const p=t.pl.find(x=>x.id==id);if(p)return p}},pn=v=>P(v.pid)?.n||v.p||'',age=d=>d?Math.floor((Date.now()-new Date(d))/31557600000):'';
const nz=m=>{const E=m.ev||[],c=(t,o)=>E.filter(v=>(v.t==t&&GL.includes(v.k))||(v.t==o&&v.k=='og')).length;return E.some(v=>[...GL,'og'].includes(v.k))?{...m,sa:c(m.a,m.b),sb:c(m.b,m.a)}:m};
const pst=id=>{const r={a:0,g:0,y:0,r:0};S.matches.forEach(m=>{if(m.status=='wait')return;let ap=['a','b'].some(x=>((m.lu||{})[x]?.st||[]).includes(id));(m.ev||[]).forEach(v=>{if(v.k=='s'&&v.p2==id)ap=1;if(v.pid==id){if(GL.includes(v.k))r.g++;if(v.k=='y')r.y++;if(v.k=='r')r.r++}});r.a+=ap?1:0});return r};

const T=id=>S.teams.find(t=>t.id==id),G=id=>nz(S.matches.find(m=>m.id==id));
const lg=t=>t&&t.logo?`<img class="lg" src="${e(t.logo)}" alt="">`:`<span class="lg">${e((t?.name||'؟')[0])}</span>`;
function win(m){if(!m||m.status!='done'||m.sa==null||m.sb==null)return null;if(m.sa!=m.sb)return m.sa>m.sb?m.a:m.b;if(m.pa!=null&&m.pb!=null&&m.pa!=m.pb)return m.pa>m.pb?m.a:m.b;return null}
const ms=()=>S.matches.map(m=>m.id=='final'?nz({...m,a:win(G('sf1')),b:win(G('sf2'))}):nz(m));
const ts=m=>m.date?new Date(m.date+'T'+(m.time||'00:00')).getTime():0;
const when=m=>(m.date?new Date(ts(m)).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'}):'الموعد لم يحدد بعد')+(m.time?' • '+m.time:'')+((m.venue||S.info.venue)?' • '+e(m.venue||S.info.venue):'');
function card(m,big){const a=T(m.a),b=T(m.b),sh=m.status=='done'||m.status=='live';
return`<a class="mc ${big?'big':''}" href="#/m/${m.id}"><div class="rd"><span>${RD[m.round]||e(m.round)}</span><span class="st ${m.status}">${ST[m.status]}</span></div><div class="row"><div class="tm">${lg(a)}<b>${e(a?.name||'يحدد لاحقًا')}</b></div><div class="sc">${sh?(m.sa??0)+' – '+(m.sb??0):'×'}</div><div class="tm">${lg(b)}<b>${e(b?.name||'يحدد لاحقًا')}</b></div></div>${m.pa!=null&&m.pb!=null?`<div class="mt">ركلات الترجيح: ${m.pa} – ${m.pb}</div>`:''}<div class="mt">${when(m)}</div></a>`}
const nextM=()=>ms().filter(m=>m.status=='wait'&&m.a&&m.b&&m.date).sort((x,y)=>ts(x)-ts(y))[0];
const cdH=m=>`<div class="cd" data-t="${ts(m)}"></div>`;
function tick(){document.querySelectorAll('.cd').forEach(el=>{let d=Math.max(0,el.dataset.t-Date.now())/1000|0;const p=[[d/86400|0,'يوم'],[d%86400/3600|0,'ساعة'],[d%3600/60|0,'دقيقة'],[d%60,'ثانية']];el.innerHTML=p.map(x=>`<div>${x[0]}<small>${x[1]}</small></div>`).join('')})}
setInterval(tick,1000);
function calc(){const r={};S.teams.forEach(t=>r[t.id]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
ms().filter(m=>m.status=='done'&&m.a&&m.b&&m.sa!=null&&m.sb!=null).forEach(m=>{const x=r[m.a],y=r[m.b];if(!x||!y)return;x.p++;y.p++;x.gf+=m.sa;x.ga+=m.sb;y.gf+=m.sb;y.ga+=m.sa;if(m.sa>m.sb){x.w++;y.l++;x.pts+=3}else if(m.sb>m.sa){y.w++;x.l++;y.pts+=3}else{x.d++;y.d++;x.pts++;y.pts++}});
return Object.values(r).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function scorers(){const r={};S.matches.forEach(m=>(m.ev||[]).filter(v=>GL.includes(v.k)).forEach(v=>{const k=v.t+'|'+(v.pid||v.p);(r[k]=r[k]||{p:pn(v),t:v.t,g:0,id:v.pid}).g++}));
const c=calc().reduce((o,x)=>(o[x.t.id]=x.p,o),{});return Object.values(r).map(x=>({...x,mp:x.id?pst(x.id).a:c[x.t]||0})).sort((a,b)=>b.g-a.g)}
const cnt=(...k)=>S.matches.reduce((n,m)=>n+(m.ev||[]).filter(v=>k.includes(v.k)).length,0);
const bracket=()=>{const l=ms();const c=(m)=>{const a=T(m.a),b=T(m.b);return`<a class="card" href="#/m/${m.id}">${e(a?.name||'—')} × ${e(b?.name||'—')}<div class="mu">${m.status=='done'?m.sa+' – '+m.sb:RD[m.round]}</div></a>`};
return`<div class="bk"><div>${c(l[0])}${c(l[1])}</div><div>${c(l[2])}</div></div>`};
const news=n=>`<article class="card nw">${n.img?`<img src="${e(n.img)}" alt="">`:''}<h3>${e(n.t)}</h3><div class="mu">${e(n.d)}</div><p>${e(n.x).replace(/\n/g,'<br>')}</p>${n.id?waA(sh('/n/'+n.id)):''}</article>`;
const nl=()=>[...S.news].sort((a,b)=>(b.d||'').localeCompare(a.d||''));
function home(){const n=nextM(),done=ms().filter(m=>m.status=='done').sort((a,b)=>ts(b)-ts(a))[0],q=S.teams.map(t=>`<span class="st">${e(t.name)}</span>`).join(' '),c=calc(),tp=cnt('g','pg','og');
return`<section class="hero"><div style="font-size:42px">⚽</div><h1>${e(S.info.name)}</h1><span class="ed">${e(S.info.edition)}</span><div style="margin-top:8px">قرية ${e(S.info.village)}</div></section>
<div class="grid" style="margin-top:10px">${[['matches','المباريات'],['teams','الفرق'],['table','الترتيب'],['scorers','الهدافون'],['news','الأخبار'],['stats','الإحصائيات']].map(x=>`<a href="#/${x[0]}">${x[1]}</a>`).join('')}</div>
<h2>المباراة القادمة</h2>${n?card(n,1)+cdH(n):'<div class="card mu">لم يتم تحديد موعد المباراة القادمة بعد</div>'}
<h2>آخر نتيجة</h2>${done?card(done):'<div class="card mu">لا توجد نتائج بعد</div>'}
<h2>الفرق المتأهلة لنصف النهائي</h2><div class="card">${q}</div><h2>الأدوار الإقصائية</h2>${bracket()}
<h2>إحصائيات مختصرة</h2><div class="grid"><div class="tile"><b>${S.matches.filter(m=>m.status=='done').length}</b>مباريات منتهية</div><div class="tile"><b>${tp}</b>أهداف مسجلة</div></div>
<h2>آخر الأخبار</h2>${nl().slice(0,3).map(news).join('')||'<div class="card mu">لا توجد أخبار بعد</div>'}`}
function matches(){const n=nextM();return`<h2>المباريات</h2>${n?'<div class="mu">المباراة القادمة</div>'+card(n,1)+cdH(n):''}${ms().map(m=>card(m)).join('')}`}
const pitch=(m,s)=>{const L=(m.lu||{})[s];if(!L||!(L.st||[]).some(Boolean))return'<div class="card mu">لم تُدخل التشكيلة الأساسية بعد</div>';
const rows=[1,...(L.f||'4-4-2').split('-').map(Number).filter(Boolean)],k=rows.length;let i=0,h='';
rows.forEach((n,r)=>{const y=r?72-(r-1)*(58/Math.max(1,k-2)):90;for(let j=0;j<n;j++){const p=P(L.st[i++]);if(!p)continue;h+=`<div class="pp" style="left:${(j+1)*100/(n+1)}%;top:${y}%"><i>${e(p.no??'')}${p.id==L.c?'<u>C</u>':''}</i><span>${e(p.n.split(' ').pop())}</span></div>`}});return`<div class="pitch">${h}</div>`};
const pl1=ids=>(ids||[]).map(P).filter(Boolean).map(p=>`<div class="ev"><span class="lg" style="width:28px;height:28px;font-size:12px">${e(p.no??'')}</span><b>${e(p.n)}</b><span class="mu">${e(p.p||'')}</span></div>`).join('')||'<span class="mu">غير متوفر</span>';
const sT=x=>{tab=x;render()};
function mdet(id){const m=ms().find(x=>x.id==id);if(!m)return'<div class="card">المباراة غير موجودة</div>';
const w=win(m),E=m.ev||[],L=s=>(m.lu||{})[s]||{st:[],bn:[]},side=[['a',m.a],['b',m.b]];
const tb=[['o','نظرة عامة'],['l','التشكيلات'],['e','الأحداث'],['s','الإحصائيات'],['p','اللاعبون']];let b='';
if(tab=='o')b=(w?`<div class="card" style="text-align:center">✅ المتأهل: <b>${e(T(w)?.name)}</b></div>`:'')+(m.status=='wait'?'<div class="card mu">المباراة لم تبدأ بعد</div>':'')+(E.length?'':'<div class="card mu">لا توجد أحداث مسجلة</div>');
if(tab=='l')b=side.map(([s,t])=>`<h2>${e(T(t)?.name||'')} <span class="ba">${e(L(s).f||'')}</span></h2>${pitch(m,s)}<div class="mu">${L(s).co?'المدرب: '+e(L(s).co):''} ${P(L(s).c)?' • القائد: '+e(P(L(s).c).n):''}</div>`).join('');
if(tab=='e'){const cell=v=>`${IC[v.k]} <b>${e(pn(v))}</b>${v.k=='s'?` <span class="mu">⇠ ${e(P(v.p2)?.n||'')}</span>`:''}<div class="mu">${EN[v.k]}${v.d?' — '+e(v.d):''}</div>`;
b=`<div class="mu">أحداث أدخلها المسؤول يدويًا — النتيجة محسوبة منها</div><div class="card">${[...E].sort((x,y)=>(x.min||0)-(y.min||0)).map(v=>PH.includes(v.k)?`<div class="ph">${IC[v.k]} ${EN[v.k]} ${v.min?v.min+"'":''} ${e(v.d||'')}</div>`:`<div class="tl"><div>${v.t==m.a?cell(v):''}</div><b>${v.min??''}'</b><div>${v.t==m.b?cell(v):''}</div></div>`).join('')||'<span class="mu">لا توجد أحداث مسجلة بعد</span>'}</div>`}
if(tab=='s'){const c=(t,k)=>E.filter(v=>v.t==t&&k.includes(v.k)).length,R=[['أهداف',m.sa??0,m.sb??0],['ركلات جزاء مسجلة',c(m.a,['pg']),c(m.b,['pg'])],['ركلات جزاء مهدرة',c(m.a,['pm']),c(m.b,['pm'])],['بطاقات صفراء',c(m.a,['y']),c(m.b,['y'])],['بطاقات حمراء',c(m.a,['r']),c(m.b,['r'])],['تبديلات',c(m.a,['s']),c(m.b,['s'])]];
b=E.length||m.sa!=null?`<span class="ba">محسوبة تلقائيًا من الأحداث</span><div class="card sx"><table>${R.map(r=>`<tr><td>${r[1]}</td><td>${r[0]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`:'<div class="card mu">لا توجد إحصائيات بعد</div>'}
if(tab=='p')b=side.map(([s,t])=>`<h2>${e(T(t)?.name||'')}</h2><div class="card"><b>الأساسيون</b>${pl1(L(s).st)}</div><div class="card"><b>البدلاء</b>${pl1(L(s).bn)}</div>`).join('');
return`${card(m,1)}<div class="tabs">${tb.map(x=>`<button class="${x[0]==tab?'on':''}" onclick="sT('${x[0]}')">${x[1]}</button>`).join('')}</div>${b}`}
const teams=()=>`<h2>الفرق</h2><div class="grid">${S.teams.map(t=>`<a href="#/t/${t.id}">${lg(t)}<div>${e(t.name)}</div></a>`).join('')}</div>`;
