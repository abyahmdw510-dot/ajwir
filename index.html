<style>

td .lg{width:30px;height:30px;font-size:13px}

.shb{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#07351b;font-weight:800;border-radius:12px;padding:10px 14px;font-size:14px}.wa svg{width:20px;height:20px}.sh2{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}

</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>{const m=(id,r,a,b)=>({id,round:r,a,b,date:'',time:'',venue:'',status:'wait',sa:null,sb:null,pa:null,pb:null,ev:[],la:'',lb:''});
return{demo:0,info:{name:'بطولة آجوير المحلية لكرة القدم',edition:'النسخة 13',village:'آجوير',venue:'',logo:'',text:''},
teams:['الإتحاد','التاكه','الفلوجة','السلام'].map((n,i)=>({id:i+1,name:n,logo:'',pl:[]})),
matches:[m('sf1','sf1',1,2),m('sf2','sf2',3,4),m('final','final',null,null)],news:[]}};
let S=blank();
let PW=(()=>{try{return sessionStorage.getItem('apw')||''}catch{return ''}})(),dirty=false;const U={isOwner:()=>!!PW};
const ST={wait:'لم تبدأ',live:'جارية الآن',done:'انتهت',post:'مؤجلة'},RD={sf1:'نصف النهائي الأول',sf2:'نصف النهائي الثاني',final:'النهائي'},IC={g:'⚽',pg:'⚽',pm:'❌',og:'🥅',y:'🟨',r:'🟥',s:'🔁',ko:'▶️',ht:'⏸️',sh:'▶️',ft:'🏁',et:'⏱️'},EN={g:'هدف',pg:'هدف من ركلة جزاء',pm:'ركلة جزاء مهدرة',og:'هدف عكسي (يُحتسب للخصم)',y:'بطاقة صفراء',r:'بطاقة حمراء',s:'تبديل',ko:'بداية الشوط الأول',ht:'نهاية الشوط الأول',sh:'بداية الشوط الثاني',ft:'نهاية المباراة',et:'وقت بدل الضائع'},PH=['ko','ht','sh','ft','et'],GL=['g','pg'];
let uid=Date.now(),tab='o';
const mig=()=>S.teams.forEach(t=>t.pl.forEach(p=>{p.id=p.id||++uid}));mig();
const P=id=>{for(const t of S.teams){const p=t.pl.find(x=>x.id==id);if(p)return p}},pn=v=>P(v.pid)?.n||v.p||'',age=d=>d?Math.floor((Date.now()-new Date(d))/31557600000):'';
const nz=m=>{const E=m.ev||[],c=(t,o)=>E.filter(v=>(v.t==t&&GL.includes(v.k))||(v.t==o&&v.k=='og')).length;return E.some(v=>[...GL,'og'].includes(v.k))?{...m,sa:c(m.a,m.b),sb:c(m.b,m.a)}:m};
const pst=id=>{const r={a:0,g:0,y:0,r:0};S.matches.forEach(m=>{if(m.status=='wait')return;let ap=['a','b'].some(x=>((m.lu||{})[x]?.st||[]).includes(id));(m.ev||[]).forEach(v=>{if(v.k=='s'&&v.p2==id)ap=1;if(v.pid==id){if(GL.includes(v.k))r.g++;if(v.k=='y')r.y++;if(v.k=='r')r.r++}});r.a+=ap?1:0});return r};

const T=id=>S.teams.find(t=>t.id==id),G=id=>nz(S.matches.find(m=>m.id==id));
const lg=t=>t&&t.logo?`<img class="lg" src="${e(t.logo)}" alt="">`:`<span class="lg">${e((t?.name||'؟')[0])}</span>`;
function win(m){if(!m||m.status!='done'||m.sa==null||m.sb==null)return null;if(m.sa!=m.sb)return m.sa>m.sb?m.a:m.b;if(m.pa!=null&&m.pb!=null&&m.pa!=m.pb)return m.pa>m.pb?m.a:m.b;return null}
const ms=()=>S.matches.map(m=>m.id=='final'?nz({...m,a:win(G('sf1')),b:win(G('sf2'))}):nz(m));
const ts=m=>m.date?new Date(m.date+'T'+(m.time||'00:00')).getTime():0;
const when=m=>(m.date?new Date(ts(m)).toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'}):'الموعد لم يحدد بعد')+(m.time?' • '+m.time:'')+((m.venue||S.info.venue)?' • '+e(m.venue||S.info.venue):'');
function card(m,big){const a=T(m.a),b=T(m.b),sh=m.status=='done'||m.status=='live';
return`<a class="mc ${big?'big':''}" href="#/m/${m.id}"><div class="rd"><span>${RD[m.round]||e(m.round)}</span><span class="st ${m.status}">${ST[m.status]}${m.status=='live'&&m.t0?' • '+mnH(m):''}</span></div><div class="row"><div class="tm">${lg(a)}<b>${e(a?.name||'يحدد لاحقًا')}</b></div><div class="sc">${sh?(m.sa??0)+' – '+(m.sb??0):'×'}</div><div class="tm">${lg(b)}<b>${e(b?.name||'يحدد لاحقًا')}</b></div></div>${m.pa!=null&&m.pb!=null?`<div class="mt">ركلات الترجيح: ${m.pa} – ${m.pb}</div>`:''}<div class="mt">${when(m)}</div></a>`}
const nextM=()=>ms().filter(m=>m.status=='wait'&&m.a&&m.b&&m.date).sort((x,y)=>ts(x)-ts(y))[0];
const cdH=m=>`<div class="cd" data-t="${ts(m)}"></div>`;
function tick(){document.querySelectorAll('.mn').forEach(el=>{el.textContent=lvm(+el.dataset.a,+el.dataset.b,+el.dataset.h)+"'"});document.querySelectorAll('.cd').forEach(el=>{let d=Math.max(0,el.dataset.t-Date.now())/1000|0;const p=[[d/86400|0,'يوم'],[d%86400/3600|0,'ساعة'],[d%3600/60|0,'دقيقة'],[d%60,'ثانية']];el.innerHTML=p.map(x=>`<div>${x[0]}<small>${x[1]}</small></div>`).join('')})}
setInterval(tick,1000);
function calc(){const r={};S.teams.forEach(t=>r[t.id]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
ms().filter(m=>m.status=='done'&&m.a&&m.b&&m.sa!=null&&m.sb!=null).forEach(m=>{const x=r[m.a],y=r[m.b];if(!x||!y)return;x.p++;y.p++;x.gf+=m.sa;x.ga+=m.sb;y.gf+=m.sb;y.ga+=m.sa;if(m.sa>m.sb){x.w++;y.l++;x.pts+=3}else if(m.sb>m.sa){y.w++;x.l++;y.pts+=3}else{x.d++;y.d++;x.pts++;y.pts++}});
return Object.values(r).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function scorers(){const r={};S.matches.forEach(m=>(m.ev||[]).filter(v=>GL.includes(v.k)).forEach(v=>{const k=v.t+'|'+(v.pid||v.p);(r[k]=r[k]||{p:pn(v),t:v.t,g:0,id:v.pid}).g++}));
const c=calc().reduce((o,x)=>(o[x.t.id]=x.p,o),{});return Object.values(r).map(x=>({...x,mp:x.id?pst(x.id).a:c[x.t]||0})).sort((a,b)=>b.g-a.g)}
const cnt=(...k)=>S.matches.reduce((n,m)=>n+(m.ev||[]).filter(v=>k.includes(v.k)).length,0);
const bracket=()=>{const l=ms();const c=(m)=>{const a=T(m.a),b=T(m.b);return`<a class="card" href="#/m/${m.id}">${e(a?.name||'—')} × ${e(b?.name||'—')}<div class="mu">${m.status=='done'?m.sa+' – '+m.sb:RD[m.round]}</div></a>`};
return`<div class="bk"><div>${c(l[0])}${c(l[1])}</div><div>${c(l[2])}</div></div>`};
const news=n=>`<article class="card nw">${n.img?`<img src="${e(n.img)}" alt="">`:''}<h3>${e(n.t)}</h3><div class="mu">${e(n.d)}</div><p>${e(n.x).replace(/\n/g,'<br>')}</p>${n.id?waA(sh('/n/'+n.id)):''}</article>`;
const nl=()=>[...S.news].sort((a,b)=>(b.d||'').localeCompare(a.d||''));
function home(){const n=nextM(),done=ms().filter(m=>m.status=='done').sort((a,b)=>ts(b)-ts(a))[0],q=S.teams.map(t=>`<span class="st">${e(t.name)}</span>`).join(' '),c=calc(),tp=cnt('g','pg','og');
return`<section class="hero"><div style="font-size:42px">⚽</div><h1>${e(S.info.name)}</h1><span class="ed">${e(S.info.edition)}</span><div style="margin-top:8px">قرية ${e(S.info.village)}</div></section>
<div class="grid" style="margin-top:10px">${[['matches','المباريات'],['teams','الفرق'],['table','الترتيب'],['scorers','الهدافون'],['news','الأخبار'],['stats','الإحصائيات']].map(x=>`<a href="#/${x[0]}">${x[1]}</a>`).join('')}</div>
${ms().some(m=>m.status=='live')?'<h2>🔴 مباشر الآن</h2>'+ms().filter(m=>m.status=='live').map(m=>card(m,1)).join(''):''}<h2>المباراة القادمة</h2>${n?card(n,1)+cdH(n):'<div class="card mu">لم يتم تحديد موعد المباراة القادمة بعد</div>'}
<h2>آخر نتيجة</h2>${done?card(done):'<div class="card mu">لا توجد نتائج بعد</div>'}
<h2>الفرق المتأهلة لنصف النهائي</h2><div class="card">${q}</div><h2>الأدوار الإقصائية</h2>${bracket()}
${(x=>x?`<div class="card">🥇 الهداف: <b>${e(x.p)}</b> — ${e(T(x.t)?.name||'')} (${x.g})</div>`:'')(scorers()[0])}<h2>إحصائيات مختصرة</h2><div class="grid"><div class="tile"><b>${S.matches.filter(m=>m.status=='done').length}</b>مباريات منتهية</div><div class="tile"><b>${tp}</b>أهداف مسجلة</div></div>
<h2>آخر الأخبار</h2>${nl().slice(0,3).map(news).join('')||'<div class="card mu">لا توجد أخبار بعد</div>'}`}
function matches(){const n=nextM();return`<h2>المباريات</h2>${n?'<div class="mu">المباراة القادمة</div>'+card(n,1)+cdH(n):''}${ms().map(m=>card(m)).join('')}`}
const pitch=(m,s)=>{const L=(m.lu||{})[s];if(!L||!(L.st||[]).some(Boolean))return'<div class="card mu">لم تُدخل التشكيلة الأساسية بعد</div>';
const rows=[1,...(L.f||'4-4-2').split('-').map(Number).filter(Boolean)],k=rows.length;let i=0,h='';
rows.forEach((n,r)=>{const y=r?72-(r-1)*(58/Math.max(1,k-2)):90;for(let j=0;j<n;j++){const p=P(L.st[i++]);if(!p)continue;h+=`<div class="pp" style="left:${(j+1)*100/(n+1)}%;top:${y}%"><i>${e(p.no??'')}${p.id==L.c?'<u>C</u>':''}</i><span>${e(p.n.split(' ').pop())}</span></div>`}});return`<div class="pitch">${h}</div>`};
const pl1=ids=>(ids||[]).map(P).filter(Boolean).map(p=>`<div class="ev"><span class="lg" style="width:28px;height:28px;font-size:12px">${e(p.no??'')}</span><b>${e(p.n)}</b><span class="mu">${e(p.p||'')}</span></div>`).join('')||'<span class="mu">غير متوفر</span>';
const sT=x=>{tab=x;render()};
function mdet(id){const m=ms().find(x=>x.id==id);if(!m)return'<div class="card">المباراة غير موجودة</div>';
const w=win(m),E=m.ev||[],L=s=>(m.lu||{})[s]||{st:[],bn:[]},side=[['a',m.a],['b',m.b]];
const tb=[['o','نظرة عامة'],['l','التشكيلات'],['e','الأحداث'],['s','الإحصائيات'],['p','اللاعبون']];let b='';
if(tab=='o')b=(w?`<div class="card" style="text-align:center">✅ المتأهل: <b>${e(T(w)?.name)}</b></div>`:'')+(m.status=='wait'?'<div class="card mu">المباراة لم تبدأ بعد</div>':'')+(E.length?'':'<div class="card mu">لا توجد أحداث مسجلة</div>');
if(tab=='l')b=side.map(([s,t])=>`<h2>${e(T(t)?.name||'')} <span class="ba">${e(L(s).f||'')}</span></h2>${pitch(m,s)}<div class="mu">${L(s).co?'المدرب: '+e(L(s).co):''} ${P(L(s).c)?' • القائد: '+e(P(L(s).c).n):''}</div>`).join('');
