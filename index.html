<script>

function migT(){const GN={1:['الإتحاد','الفلوجة','المقام','الترجي'],2:['السلام','التاكه','الشباب','لكهوله']};
[1,2].forEach(g=>GN[g].forEach(n=>{let t=S.teams.find(x=>String(x.name).trim()==n);if(!t){const id=[5,6,7,8].find(i=>!S.teams.some(x=>x.id==i))||++uid;t={id,name:n,logo:'',pl:[]};S.teams.push(t)}if(t.g==null)t.g=g}));
const A=S.matches.find(m=>m.id=='sf1'),B=S.matches.find(m=>m.id=='sf2');if(A&&!A.src)A.src={a:[1,1],b:[2,2]};if(B&&!B.src)B.src={a:[2,1],b:[1,2]}}

const T=id=>S.teams.find(t=>t.id==id),G=id=>nz(resSemi(S.matches.find(m=>m.id==id)));

function win(m){if(!m||m.status!='done'||m.sa==null||m.sb==null)return null;if(m.sa!=m.sb)return m.sa>m.sb?m.a:m.b;if(m.pa!=null&&m.pb!=null&&m.pa!=m.pb)return m.pa>m.pb?m.a:m.b;return null}

function stg(m){return m.stage||(m.round=='sf1'||m.round=='sf2'?'sf':m.round=='final'?'final':m.round=='3rd'?'3rd':'g')}
function lose(m){const w=win(m);return w==null?null:(w==m.a?m.b:m.a)}

const rdl=m=>RD[m.round]||(stg(m)=='g'&&grpOf(m)?'دور المجموعات – المجموعة '+(grpOf(m)==1?'الأولى':'الثانية'):e(m.round));
const TBN={gd:'فارق الأهداف',gf:'الأهداف المسجلة',h2h:'المواجهة المباشرة',wins:'عدد الانتصارات',ga:'الأهداف المستقبلة (الأقل أفضل)'};

function groupDone(g){const L=gMatches(g),pr=new Set(L.map(m=>[m.a,m.b].sort().join('-')));return gExp(g)>0&&pr.size>=gExp(g)&&L.every(m=>m.status=='done'&&m.sa!=null&&m.sb!=null)}

function stand(g){const L=gMatches(g),r={};gTeams(g).forEach(t=>r[t.id]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
L.filter(m=>m.status=='done'&&m.sa!=null&&m.sb!=null).forEach(m=>{const x=r[m.a],y=r[m.b];x.p++;y.p++;x.gf+=m.sa;x.ga+=m.sb;y.gf+=m.sb;y.ga+=m.sa;if(m.sa>m.sb){x.w++;y.l++;x.pts+=3}else if(m.sb>m.sa){y.w++;x.l++;y.pts+=3}else{x.d++;y.d++;x.pts++;y.pts++}});

const c0=(x,y)=>{if(y.pts!=x.pts)return y.pts-x.pts;for(const c of tb){let d=0;if(c=='gd')d=(y.gf-y.ga)-(x.gf-x.ga);else if(c=='gf')d=y.gf-x.gf;else if(c=='wins')d=y.w-x.w;else if(c=='ga')d=x.ga-y.ga;else if(c=='h2h')d=-h2h(x.t.id,y.t.id,L);if(d)return d}return 0};
